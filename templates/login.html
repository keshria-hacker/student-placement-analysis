{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card auth-card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="mb-1 fw-bold text-center">Placement Analytics</h3>
        <p class="text-muted text-center mb-4">Sign in to your account</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">
          No account? <a href="{{ url_for('register') }}">Register here</a>
        </p>
        <hr>
        <p class="text-muted small text-center mb-0">Default admin login: <b>admin</b> / <b>admin123</b></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
