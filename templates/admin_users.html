{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4">Manage Users</h2>

<div class="table-responsive">
<table class="table table-hover bg-white shadow-sm align-middle">
  <thead class="table-dark">
    <tr><th>Username</th><th>Email</th><th>Role</th><th>Joined</th><th>Change Role</th></tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
      <td><span class="badge bg-primary">{{ u.role }}</span></td>
      <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
      <td>
        <form method="POST" action="{{ url_for('change_user_role', user_id=u.id) }}" class="d-flex gap-2">
          <select name="role" class="form-select form-select-sm" style="width: auto;">
            <option value="student" {% if u.role == 'student' %}selected{% endif %}>Student</option>
            <option value="tpo" {% if u.role == 'tpo' %}selected{% endif %}>TPO</option>
            <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>Admin</option>
          </select>
          <button class="btn btn-sm btn-outline-primary">Update</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
