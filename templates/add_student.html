{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4">Add Student</h2>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Roll Number</label>
          <input type="text" name="roll_number" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <input type="text" name="department" class="form-control" placeholder="CSE / IT / ECE ..." required>
        </div>
        <div class="col-md-6">
          <label class="form-label">CGPA</label>
          <input type="number" step="0.01" min="0" max="10" name="cgpa" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Backlogs</label>
          <input type="number" min="0" name="backlogs" class="form-control" value="0">
        </div>
        <div class="col-md-4">
          <label class="form-label">Internships</label>
          <input type="number" min="0" name="internships" class="form-control" value="0">
        </div>
        <div class="col-md-4">
          <label class="form-label">Communication Score (1-10)</label>
          <input type="number" min="1" max="10" name="communication_score" class="form-control" value="5">
        </div>
        <div class="col-md-6">
          <label class="form-label">10th (SSC) %</label>
          <input type="number" step="0.1" name="ssc_percentage" class="form-control" value="70">
        </div>
        <div class="col-md-6">
          <label class="form-label">12th (HSC) %</label>
          <input type="number" step="0.1" name="hsc_percentage" class="form-control" value="70">
        </div>
        <div class="col-12">
          <label class="form-label">Technical Skills (comma separated)</label>
          <input type="text" name="technical_skills" class="form-control" placeholder="Python, SQL, React">
        </div>
        <div class="col-md-6">
          <label class="form-label">Historical Placement Status (optional)</label>
          <select name="placement_status" class="form-select">
            <option value="">Unknown / Not yet placed</option>
            <option value="Placed">Placed</option>
            <option value="Not Placed">Not Placed</option>
          </select>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-success">Save Student</button>
        <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
